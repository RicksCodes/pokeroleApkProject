<!-- ============================================================
     BATTLE LOBBY MODAL
     Da incollare dentro trainer.html, prima del tag </body>

     Script da aggiungere nell'<head> di trainer.html:
     <script src="utils/battle-bridge.js"></script>
     <script src="battle-lobby.js"></script>

     Bottone da aggiungere nell'header di trainer.html:
     <button onclick="apriBattleLobby()" class="btn-multiplayer">⚔️ Multiplayer</button>
     ============================================================ -->

<!-- ── MODAL PRINCIPALE LOBBY ── -->
<div id="modal-battle-lobby" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:9000; flex-direction:column; align-items:center; justify-content:flex-start; overflow-y:auto; padding: 0 0 40px 0;">

    <!-- Header -->
    <div style="width:100%; max-width:480px; display:flex; align-items:center; justify-content:space-between; padding:16px 18px 0;">
        <button id="lobby-btn-back" onclick="lobbyGoBack()" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer; padding:4px 8px;">←</button>
        <h2 id="lobby-title" style="margin:0; font-size:1.1rem; color:#fff; font-weight:700;">⚔️ Battaglia Multiplayer</h2>
        <button onclick="chiudiBattleLobby()" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer; padding:4px 8px;">✕</button>
    </div>

    <!-- Contenuto dinamico -->
    <div id="lobby-content" style="width:100%; max-width:480px; padding:18px; display:flex; flex-direction:column; gap:16px; background:var(--card-bg); border-radius:16px; margin-top:8px;">
        <!-- Viene popolato da battle-lobby.js -->
    </div>

</div>
